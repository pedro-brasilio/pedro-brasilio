name: generate arcade

on:
  # roda automaticamente todo dia as 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

  # permite rodar manualmente pela aba Actions
  workflow_dispatch:

  # roda a cada push na main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # gera o svg animado do bomberman a partir do grafico de contribuicoes
      - name: generate bomberman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'bomberman'

      # publica o conteudo de dist/ na branch output
      - name: push svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
